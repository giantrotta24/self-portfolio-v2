[build]
  command = "npm run build"
  publish = "dist"

# Security headers. Lighthouse's Best Practices "trust & safety" audits
# (csp-xss, has-hsts, origin-isolation, clickjacking-mitigation,
# trusted-types-xss) flag these as missing — they're weight-0 in the
# score so they don't move the number, but the gaps are real in
# production, not just on the dev server.
#
# script-src's two hashes cover the only inline scripts Astro emits, each
# byte-identical on every page:
#   - sha256-kOf4…: the mobile-nav Escape-key handler (Header.astro,
#     emitted as <script type="module">).
#   - sha256-e1Ty…: the pre-paint theme script (Base.astro <head>,
#     <script is:inline>), which applies a stored light/dark choice before
#     first paint and flags that JS runs.
# If either source changes, or a dependency bump changes the minified
# output, regenerate: build the site, then
#   node -e "const h=require('fs').readFileSync('dist/index.html','utf8');for(const m of h.matchAll(/<script(?![^>]*\bsrc=)(?![^>]*ld\+json)[^>]*>([\s\S]*?)<\/script>/g))console.log('sha256-'+require('crypto').createHash('sha256').update(m[1]).digest('base64'))"
# JSON-LD <script type="application/ld+json"> blocks are exempt from
# script-src by spec (non-JS MIME type), so they need no entry here
# despite differing per page.
#
# The Contact page's booking button is a plain link to cal.com, not
# Cal's embed: the embed injects inline styles, which style-src 'self'
# blocks, leaving the modal unstyled below the fold with scroll locked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-kOf4WRzWmFPXcQvmRYat0Nt1+40XXSbXeSPuO+Kl/C8=' 'sha256-e1TyQYeaTeVRTruAV5LM5wepZAVZZ/R/SbILb26Fr7s='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; require-trusted-types-for 'script'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"

# Markdown page versions (generate-markdown-pages.mjs) — serve with the
# correct MIME type instead of Netlify's default octet-stream for .md.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Unlisted pages sent by link (e.g. /checkup/med13/): reachable, never indexed.
[[headers]]
  for = "/checkup/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /things/#<encoded things:///add URL>: the to-do rides in the fragment, which
# never reaches the server. no-referrer so the page leaks nothing onward.
[[headers]]
  for = "/things/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
